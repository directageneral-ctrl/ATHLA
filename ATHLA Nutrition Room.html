<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Reflector} from 'three/addons/objects/Reflector.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080a);
scene.fog = new THREE.FogExp2(0x08080a,0.03);

const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(),0.04).texture;   // instant fallback
scene.environmentIntensity = 0.12;

/* real HDR environment for physically-based reflections (graceful fallback kept) */
new RGBELoader().load(
  'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
  tex=>{
    tex.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = pm.fromEquirectangular(tex).texture;
    scene.environmentIntensity = 0.18;
    scene.environmentRotation.y = 2.4;
    tex.dispose();
    const el=document.getElementById('load'); el.style.opacity=0; setTimeout(()=>el.remove(),900);
  },
  undefined,
  ()=>{ const el=document.getElementById('load'); el.textContent='HDR OFFLINE · PROCEDURAL ENV'; setTimeout(()=>{el.style.opacity=0;setTimeout(()=>el.remove(),900);},1400); }
);

const camera = new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,80);
const VIEWS = {
  corner:{p:[4.4,2.3,5.8], t:[0,1.25,0]},
  front :{p:[0.3,1.5,6.6], t:[0,1.4,0]},
  inside:{p:[1.05,1.5,1.05],t:[-0.75,1.15,-0.85]},
  plan  :{p:[0,7.6,0.02],  t:[0,0,0]}
};
camera.position.set(...VIEWS.corner.p);

const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(...VIEWS.corner.t);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 1.2; controls.maxDistance = 9;
controls.maxPolarAngle = 1.53;
controls.autoRotate = true; controls.autoRotateSpeed = 0.4;

/* ---------- helpers ---------- */
const P = (x,y,z)=>new THREE.Vector3(x,y,z);
const H = 2.6, C = 0.45;
const ledMats = [], ledLights = [], atmo = [];

function makeCanvas(w,h,draw){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  draw(cv.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return t;
}
function spaced(c,txt,cx,y,ls){
  let w=0; for(const ch of txt) w+=c.measureText(ch).width+ls; w-=ls;
  let x=cx-w/2; const ta=c.textAlign; c.textAlign='left';
  for(const ch of txt){ c.fillText(ch,x,y); x+=c.measureText(ch).width+ls; }
  c.textAlign=ta;
}
function box(parent,w,h,d,mat,x,y,z,o={}){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  if(o.ry)m.rotation.y=o.ry; if(o.rx)m.rotation.x=o.rx; if(o.rz)m.rotation.z=o.rz;
  m.castShadow=!!o.cast; m.receiveShadow=o.recv!==false;
  parent.add(m); return m;
}
function rbox(parent,w,h,d,r,mat,x,y,z,o={}){
  const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),mat);
  m.position.set(x,y,z);
  if(o.ry)m.rotation.y=o.ry; if(o.rx)m.rotation.x=o.rx;
  m.castShadow=!!o.cast; m.receiveShadow=true;
  parent.add(m); return m;
}
function cyl(parent,rt,rb,h,mat,x,y,z,o={}){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,o.seg||24,1,!!o.open,o.ts||0,o.tl||Math.PI*2),mat);
  m.position.set(x,y,z);
  if(o.rx)m.rotation.x=o.rx; if(o.rz)m.rotation.z=o.rz;
  m.castShadow=!!o.cast; m.receiveShadow=true;
  parent.add(m); return m;
}
function tubePath(parent,pts,r,mat){
  const g=new THREE.Group(), Y=P(0,1,0);
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1], d=b.clone().sub(a), len=d.length();
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),mat);
    m.position.copy(a).addScaledVector(d,0.5);
    m.quaternion.setFromUnitVectors(Y,d.clone().normalize());
    g.add(m);
  }
  pts.forEach(p=>{ const s=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat); s.position.copy(p); g.add(s); });
  parent.add(g); return g;
}
function leafGeo(L,W){
  const s=new THREE.Shape();
  s.moveTo(0,0); s.quadraticCurveTo(W,L*0.35,0,L); s.quadraticCurveTo(-W,L*0.35,0,0);
  const g=new THREE.ShapeGeometry(s,12), p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const y=p.getY(i); p.setZ(i,Math.pow(y/L,2)*L*0.22); }
  g.computeVertexNormals(); return g;
}
function tubShellGeometry(rMid,thick,hBack,hArm,a0,a1,segT=96){
  const rr=thick/2, rIn=rMid-rr, rOut=rMid+rr, yBase=0.16;
  const wallSeg=6, rimSeg=10;
  const stride=(wallSeg+1)+(rimSeg-1)+(wallSeg+1);
  const pos=[], idx=[];
  let firstRow=null;
  const hAt=t=>{
    const th=a0+(a1-a0)*t;
    const c=(Math.cos(th-Math.PI)+1)/2;
    const s=THREE.MathUtils.smoothstep(c,0.12,0.9);
    return hArm+(hBack-hArm)*s;
  };
  for(let i=0;i<=segT;i++){
    const t=i/segT, th=a0+(a1-a0)*t;
    const h=hAt(t), hRim=h-rr, sn=Math.sin(th), cs=Math.cos(th);
    const row=[];
    for(let j=0;j<=wallSeg;j++) row.push([rIn, yBase+(hRim-yBase)*(j/wallSeg)]);
    for(let j=1;j<rimSeg;j++){
      const ang=Math.PI-Math.PI*(j/rimSeg);
      row.push([rMid+rr*Math.cos(ang), hRim+rr*Math.sin(ang)]);
    }
    for(let j=0;j<=wallSeg;j++) row.push([rOut, hRim-(hRim-yBase)*(j/wallSeg)]);
    if(!firstRow) firstRow=row;
    row.forEach(([r,y])=>pos.push(sn*r,y,cs*r));
  }
  for(let i=0;i<segT;i++)
    for(let j=0;j<stride-1;j++){
      const a=i*stride+j, b=a+stride;
      idx.push(a,b,a+1, b,b+1,a+1);
    }
  const contour=firstRow.map(([r,y])=>new THREE.Vector2(r,y));
  const tris=THREE.ShapeUtils.triangulateShape(contour,[]);
  [a0,a1].forEach(th=>{
    const off=pos.length/3, sn=Math.sin(th), cs=Math.cos(th);
    firstRow.forEach(([r,y])=>pos.push(sn*r,y,cs*r));
    tris.forEach(tr=>idx.push(off+tr[0],off+tr[1],off+tr[2]));
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

  c.strokeStyle='rgba(160,210,240,0.5)'; c.beginPath(); c.moveTo(690,560); c.lineTo(980,560); c.stroke();
});
const consoleTex = makeCanvas(512,320,(c,w,h)=>{

/* ---------- materials ---------- */

function label(text){
  const tex=makeCanvas(256,112,(c,w,h)=>{
    c.fillStyle='rgba(10,10,13,0.78)'; c.strokeStyle='rgba(255,178,94,0.95)'; c.lineWidth=3;
    c.beginPath(); c.roundRect(6,6,w-12,h-12,26); c.fill(); c.stroke();
    c.fillStyle='#fff'; c.font='600 46px system-ui'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(text,w/2,h/2+2);
  });
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  s.scale.set(0.46,0.20,1); s.renderOrder=999; return s;
}
const dimMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.75,depthTest:false});
function dim(a,b,labelPos,text){
  const g=new THREE.Group();
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),dimMat);
  line.renderOrder=998; g.add(line);
  const dir=b.clone().sub(a).normalize();
  const up=Math.abs(dir.y)>0.9?P(1,0,0):P(0,1,0);
  const perp=new THREE.Vector3().crossVectors(dir,up).normalize().multiplyScalar(0.07);
  [a,b].forEach(p=>{
    const t=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p.clone().sub(perp),p.clone().add(perp)]),dimMat);
    t.renderOrder=998; g.add(t);
  });
  const sp=label(text); sp.position.copy(labelPos); g.add(sp);
  return g;
}

const composer=new EffectComposer(renderer);

let gtao=null;
try{
  gtao=new GTAOPass(scene,camera,innerWidth,innerHeight);
  gtao.output=GTAOPass.OUTPUT.Default;
  gtao.updateGtaoMaterial({radius:0.28,distanceExponent:1,thickness:1,scale:1,samples:16,distanceFallOff:1,screenSpaceRadius:false});
  gtao.blendIntensity=0.85;
  const gtaoRender=gtao.render.bind(gtao);
  gtao.render=(r,w,rb,dt,ma)=>{           // keep glass / atmosphere out of the AO depth pass
    atmo.forEach(o=>o.visible=false);
    gtaoRender(r,w,rb,dt,ma);
    atmo.forEach(o=>o.visible=true);
  };
  composer.addPass(gtao);
}catch(e){ gtao=null; }
const bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.5,1.5);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

}

fileInput.addEventListener('change',()=>{
  const f=fileInput.files[0]; if(!f) return;
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{
    const t=new THREE.Texture(img); t.colorSpace=THREE.SRGBColorSpace; t.needsUpdate=true;
    if(uploaded) uploaded.dispose();
    uploaded=t; screen.material.map=t; screen.material.needsUpdate=true;
    URL.revokeObjectURL(url);
  };
  img.src=url; fileInput.value='';
});
$('png').addEventListener('click',()=>{
  composer.render();
  const a=document.createElement('a');
  a.download='nutrition-booth.png';
  a.href=renderer.domElement.toDataURL('image/png');
  a.click();
});
$('reset').addEventListener('click',()=>{
  ledIn.value=1; expIn.value=1.25; bloomIn.value=0.55;
  ledIn.dispatchEvent(new Event('input')); expIn.dispatchEvent(new Event('input')); bloomIn.dispatchEvent(new Event('input'));
  if(gtao){ gtao.enabled=true; sync(aoBtn,true); }
  mirror.visible=true; floorTop.material.opacity=0.7; sync(reflBtn,true);
  dims.visible=false; sync(dimsBtn,false);
  controls.autoRotate=true; sync(driftBtn,true);
  viewSel.value='corner'; goView('corner');
  controls.autoRotate=true; sync(driftBtn,true);
});

/* ---------- loop / resize ---------- */
const clock=new THREE.Clock();
let elapsed=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05); elapsed+=dt;
  foliage.rotation.y=Math.sin(elapsed*0.7)*0.02;
  const dp=dustGeo.attributes.position;
  for(let i=0;i<dustN;i++){
    let y=dp.getY(i)+dt*0.045;
    if(y>2.5) y=0.15;
    dp.setY(i,y);
    dp.setX(i,dp.getX(i)+Math.sin(elapsed*0.5+i)*dt*0.008);
  }
  dp.needsUpdate=true;
  if(tween){
    tween.t+=dt/1.1;
    const e=ease(Math.min(tween.t,1));
    camera.position.lerpVectors(tween.fp,tween.tp,e);
    controls.target.lerpVectors(tween.ft,tween.tt,e);
    if(tween.t>=1) tween=null;
  }
  controls.update();
  composer.render();
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
</script>
